apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: osee-kenya
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
spec:
  tls:
  - hosts:
    - osee-kenya.org
    - www.osee-kenya.org
    secretName: osee-kenya-tls
  rules:
  - host: osee-kenya.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: osee-kenya
            port:
              number: 80
  - host: www.osee-kenya.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: osee-kenya
            port:
              number: 80
