name: AWS Deployment

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - '!.github/workflows/aws-deploy.yml'

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build application
        run: npm run build
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
          
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.4.6
          
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init
        
      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate
        
      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan \
            -var="key_name=${{ secrets.AWS_KEY_NAME }}" \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -out=tfplan
        
      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan
        
      - name: Get EC2 public IP
        working-directory: ./terraform
        run: |
          echo "EC2_PUBLIC_IP=$(terraform output -raw web_public_ip)" >> $GITHUB_ENV
          
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/osee-kenya
            git pull
            npm ci
            npm run build
            sudo systemctl restart osee-kenya
            
      - name: Notify deployment success
        if: success()
        run: |
          echo "Deployment successful! Application is available at http://${{ env.EC2_PUBLIC_IP }}"
          
      - name: Notify deployment failure
        if: failure()
        run: |
          echo "Deployment failed. Check the logs for more information."
