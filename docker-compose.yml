version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/osee_kenya
      - NEXT_PUBLIC_SUPABASE_URL=http://supabase:8000
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    depends_on:
      - postgres
      - supabase
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=osee_kenya
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  supabase:
    image: supabase/supabase-local:latest
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_PASSWORD=postgres
      - SUPABASE_URL=http://localhost:8000
      - SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      - postgres

  # Mock service for Africa's Talking API
  africas-talking-mock:
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -c "echo 'console.log(\"Africa's Talking Mock API running on port 3001\"); require(\"http\").createServer((req, res) => { res.writeHead(200, {\"Content-Type\": \"application/json\"}); res.end(JSON.stringify({success: true, message: \"Mock response\"})); }).listen(3001);' > server.js && node server.js"
    ports:
      - "3001:3001"

  # Mock service for M-Pesa API
  mpesa-mock:
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -c "echo 'console.log(\"M-Pesa Mock API running on port 3002\"); require(\"http\").createServer((req, res) => { res.writeHead(200, {\"Content-Type\": \"application/json\"}); res.end(JSON.stringify({success: true, message: \"Mock response\"})); }).listen(3002);' > server.js && node server.js"
    ports:
      - "3002:3002"

volumes:
  postgres-data:
